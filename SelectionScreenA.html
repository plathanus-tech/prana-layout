<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SelectionScreenA - Seleção de Serviço</title>
  <link rel="stylesheet" href="SelectionScreenA.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <span class="logo">Prana</span>
    </header>

    <div class="hero">
      <div class="hero-inner">
        <span class="hero-tag">Evento</span>
        <h1 class="hero-title">Semana do Bem-Estar</h1>
        <div class="hero-meta">
          <span class="hero-meta-item">📅 10 a 14 de abril de 2026</span>
          <span class="hero-meta-item">📍 Sala de Treinamentos - Bloco A</span>
        </div>
      </div>
    </div>

    <div class="content">
      <section class="section">
        <h2 class="section-title">Escolha o serviço</h2>

        <div class="service-list">
          <div class="service-card">
            <button class="card-header">
              <div class="card-icon">✨</div>
              <div class="card-info">
                <span class="card-name">Quick Massage</span>
                <span class="card-meta">⏱ 15 min · Massagem nas costas</span>
              </div>
              <div class="card-selector">
                <span class="radio"></span>
              </div>
            </button>
          </div>

          <div class="service-card">
            <button class="card-header">
              <div class="card-icon">✂️</div>
              <div class="card-info">
                <span class="card-name">Manicure</span>
                <span class="card-meta">⏱ 30 min · Cuidado para as unhas</span>
              </div>
              <div class="card-selector">
                <span class="radio"></span>
              </div>
            </button>
          </div>

          <div class="service-card">
            <button class="card-header">
              <div class="card-icon">🦶</div>
              <div class="card-info">
                <span class="card-name">Reflexologia Podal</span>
                <span class="card-meta">⏱ 20 min · Pontos de pressão dos pés</span>
              </div>
              <div class="card-selector">
                <span class="radio"></span>
              </div>
            </button>
          </div>

          <div class="service-card">
            <button class="card-header">
              <div class="card-icon">🌬️</div>
              <div class="card-info">
                <span class="card-name">Meditação Guiada</span>
                <span class="card-meta">⏱ 20 min · Sessão de relaxamento</span>
              </div>
              <div class="card-selector">
                <span class="radio"></span>
              </div>
            </button>
          </div>
        </div>
      </section>
    </div>

    <div class="cta-bar">
      <div class="cta-inner">
        <button class="button button-primary button-lg">Agendar serviço</button>
      </div>
    </div>
  </div>

  <script src="SelectionScreenA.js"></script>
</body>
</html>
